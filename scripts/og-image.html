<!doctype html>
<!--
  Source for public/og-image.png (the Open Graph / Twitter preview, 1200 x 630).
  To regenerate: open this file in Chromium at a 1200 x 630 viewport and screenshot the page as PNG.
  Colours match src/styles/tokens.css and public/favicon.svg.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TraceLens social preview</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #030407; }
  body {
    position: relative; color: #f2f4f8;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(900px 620px at 0% 0%, rgba(27, 107, 240, 0.55), rgba(27, 107, 240, 0) 70%),
      radial-gradient(620px 460px at 100% 100%, rgba(212, 255, 36, 0.14), rgba(212, 255, 36, 0) 70%),
      #030407;
  }
  .col { position: absolute; left: 72px; top: 50px; width: 800px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 68px; height: 68px; }
  .brand span { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
  .brand b { color: #d4ff24; }
  h1 { margin-top: 42px; font-size: 70px; line-height: 1.04; font-weight: 800; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: #d4ff24; }
  p.sub { margin-top: 22px; width: 740px; font-size: 27px; line-height: 1.4; color: #a9b2c3; }
  .chips { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 12px 10px; width: 820px; }
  .chip {
    padding: 9px 20px; border-radius: 999px; font-size: 20px; font-weight: 600;
    background: rgba(18, 36, 78, 0.85); border: 1px solid rgba(120, 150, 220, 0.35); color: #f2f4f8;
  }
  .chip.hot { background: #d4ff24; border-color: #d4ff24; color: #070a12; }
  .url { position: absolute; left: 72px; bottom: 30px; font-size: 22px; font-weight: 600; color: #a9b2c3; letter-spacing: 0.01em; }
  svg.graph { position: absolute; right: 36px; top: 120px; width: 270px; height: 380px; }
</style>
</head>
<body>
  <div class="col">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b6bf0"/><stop offset="1" stop-color="#0d3f94"/></linearGradient></defs>
        <rect width="64" height="64" rx="15" fill="url(#bg)"/>
        <g stroke="#d4ff24" stroke-width="3.2" stroke-linecap="round" fill="none" opacity=".95">
          <path d="M17 32 L44 16"/><path d="M17 32 L47 32"/><path d="M17 32 L44 48"/>
        </g>
        <circle cx="17" cy="32" r="8.5" fill="#030407"/><circle cx="17" cy="32" r="4" fill="#d4ff24"/>
        <circle cx="47" cy="16" r="5" fill="#d4ff24"/><circle cx="50" cy="32" r="5" fill="#d4ff24"/><circle cx="47" cy="48" r="5" fill="#d4ff24"/>
      </svg>
      <span>Trace<b>Lens</b></span>
    </div>

    <h1>See exactly what your <em>network and sign-in</em> did.</h1>
    <p class="sub">Eight troubleshooting tools in one place. Everything runs in your browser, and nothing is uploaded.</p>

    <div class="chips">
      <span class="chip hot">HAR</span><span class="chip">SAML</span><span class="chip">OAuth / OIDC</span><span class="chip">Tokens</span>
      <span class="chip">Certificates</span><span class="chip">Windows sign-in</span><span class="chip">Cookies</span><span class="chip">Guides</span>
    </div>
  </div>

  <svg class="graph" viewBox="0 0 270 380" aria-hidden="true">
    <g stroke="#d4ff24" stroke-width="5" stroke-linecap="round" opacity=".6" fill="none">
      <path d="M60 190 L205 70"/><path d="M60 190 L215 190"/><path d="M60 190 L205 310"/>
    </g>
    <g fill="#1b6bf0"><circle cx="132" cy="130" r="8"/><circle cx="138" cy="190" r="8"/><circle cx="132" cy="250" r="8"/></g>
    <circle cx="60" cy="190" r="40" fill="#030407" stroke="#1558c9" stroke-width="6"/>
    <circle cx="60" cy="190" r="18" fill="#d4ff24"/>
    <g fill="#d4ff24"><circle cx="212" cy="64" r="22"/><circle cx="228" cy="190" r="22"/><circle cx="212" cy="316" r="22"/></g>
  </svg>

  <div class="url">tracelens.2nison6.com</div>
</body>
</html>

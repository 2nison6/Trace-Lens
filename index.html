    <!-- Avoid a white flash before the stylesheet loads, and apply the saved theme early -->
    <style>
      html {
        background: #030407;
        color-scheme: dark light;
      }
      html[data-theme="light"] {
        background: #f3f6fc;
      }

      /* Boot splash: covers the page while the JavaScript bundle downloads (index.html is static, so it paints at once).
         It stays invisible for the first 200 ms so a fast load never flashes it. React never touches it (it is not inside
         #root); the app removes it after its first painted frame. */
      #boot {
        --b-bg: #030407;
        --b-fg: #f2f4f8;
        --b-dim: #a9b2c3;
        --b-track: rgba(148, 163, 200, 0.18);
        --b-accent: #d4ff24;
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        background: var(--b-bg);
        color: var(--b-fg);
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        animation: boot-in 300ms ease-out 200ms backwards;
      }
      html[data-theme="light"] #boot {
        --b-bg: #f4f6fa;
        --b-fg: #070a12;
        --b-dim: #444d60;
        --b-track: rgba(20, 40, 90, 0.12);
        --b-accent: #1558c9;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]) #boot {
          --b-bg: #f4f6fa;
          --b-fg: #070a12;
          --b-dim: #444d60;
          --b-track: rgba(20, 40, 90, 0.12);
          --b-accent: #1558c9;
        }
      }
      #boot .boot-spin {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid var(--b-track);
        border-top-color: var(--b-accent);
        animation: boot-spin 0.8s linear infinite;
      }
      #boot .boot-msg,
      #boot .boot-reload {
        display: none;
      }
      #boot[data-state="slow"] .boot-spin {
        display: none;
      }
      #boot[data-state="slow"] .boot-msg {
        display: block;
        max-width: 36ch;
        color: var(--b-dim);
      }
      #boot[data-state="slow"] .boot-reload {
        display: inline-block;
        min-height: 40px;
        padding: 0 18px;
        border: 1px solid var(--b-track);
        border-radius: 10px;
        background: transparent;
        color: var(--b-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-spin {
          animation: boot-pulse 1.4s ease-in-out infinite !important;
          animation-duration: 1.4s !important;
          animation-iteration-count: infinite !important;
        }
      }
    </style>
    <noscript
      ><style>
        #boot {
          display: none !important;
        }
      </style></noscript
    >
    <script>
      try {
        var t = localStorage.getItem("harlens-theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
      // Watchdog: if the app has not started after 10 s, or the bundle fails to load, replace the endless spinner with a message and a Reload button.
      (function () {
        function slow() {
          var b = document.getElementById("boot");
          if (b && !window.__harlensReady) b.setAttribute("data-state", "slow");
        }
        setTimeout(slow, 10000);
        window.addEventListener(
          "error",
          function (e) {
            if (e.target && e.target.tagName === "SCRIPT") slow();
          },
          true,
        );
        document.addEventListener("DOMContentLoaded", function () {
          var r = document.querySelector("#boot .boot-reload");
          if (r)
            r.addEventListener("click", function () {
              location.reload();
            });
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-label="Loading">
      <span class="boot-spin" aria-hidden="true"></span>
      <p class="boot-msg">
        Still loading. This is taking longer than usual, so check your
        connection and reload the page.
      </p>
      <button type="button" class="boot-reload">Reload</button>
    </div>
    <noscript>
      <div
        style="
          font:
            16px/1.5 system-ui,
            sans-serif;
          color: #f5f7ff;
          background: #030407;
          padding: 48px 24px;
          text-align: center;
        "
      >
        <h1 style="margin: 0 0 8px">TraceLens</h1>
        <p>
          TraceLens checks HAR files, SAML, OAuth, tokens, certificates and
          cookies entirely in your browser, so it needs JavaScript turned on.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>

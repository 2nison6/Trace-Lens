<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TraceLens: page not found</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <style>
      :root { --bg: #030407; --fg: #f2f4f8; --dim: #a9b2c3; --line: rgba(148, 163, 200, 0.24); --accent: #d4ff24; --on-accent: #070a12; }
      @media (prefers-color-scheme: light) { :root { --bg: #f4f6fa; --fg: #070a12; --dim: #444d60; --line: rgba(20, 40, 90, 0.22); --accent: #1558c9; --on-accent: #ffffff; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      main { max-width: 440px; }
      .code { margin: 0 0 4px; font-size: 64px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; color: var(--accent); }
      h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: var(--dim); }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 22px; border-radius: 11px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
      .brand { margin-top: 28px; font-size: 13px; color: var(--dim); }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found</h1>
      <p>That address doesn't exist. TraceLens analyzes captures in your browser, and its pages all start from the home screen.</p>
      <a href="/">Open TraceLens</a>
      <p class="brand">TraceLens · nothing you open here is uploaded</p>
    </main>
  </body>
</html>
